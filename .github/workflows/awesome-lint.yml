name: Awesome Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint
        # Non-blocking: the Awesome badge is intentionally omitted, so the
        # awesome-badge rule will always fail. Kept for the other useful checks.
        continue-on-error: true
        run: npx awesome-lint
